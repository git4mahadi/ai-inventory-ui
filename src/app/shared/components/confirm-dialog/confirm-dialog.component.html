@if (open) {
  <div
    class="confirm-backdrop"
    role="presentation"
    (click)="onBackdropClick($event)"
  >
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-dialog-title'"
      [attr.aria-describedby]="'confirm-dialog-message'"
      [class.confirm-danger]="danger"
      (click)="$event.stopPropagation()"
    >
      <div class="confirm-icon" aria-hidden="true">
        @if (danger) {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
          </svg>
        }
      </div>

      <div class="confirm-body">
        <h2 id="confirm-dialog-title" class="confirm-title">{{ title }}</h2>
        <p id="confirm-dialog-message" class="confirm-message">{{ message }}</p>
        @if (detail) {
          <p class="confirm-detail">{{ detail }}</p>
        }
      </div>

      <div class="confirm-actions">
        <button
          type="button"
          class="btn-cancel"
          [disabled]="busy"
          (click)="onCancel()"
        >
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          class="btn-confirm"
          [class.btn-confirm-danger]="danger"
          [disabled]="busy"
          (click)="onConfirm()"
        >
          @if (busy) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span>Working…</span>
          } @else {
            <span>{{ confirmLabel }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
