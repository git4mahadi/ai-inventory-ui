<div class="sales-list">
  <div class="page-header d-flex justify-content-between align-items-start mb-3 gap-2 flex-wrap">
    <div>
      <p class="page-eyebrow mb-1">Sales</p>
      <h1 class="page-title h4 mb-1">Sales list</h1>
      <p class="text-muted small mb-0">All recorded sales items.</p>
      <span class="toolbar-meta">{{ sales.length | bdNumber }} total</span>
    </div>
    <a routerLink="/sales/create" class="btn btn-green btn-sm">Create sale</a>
  </div>

  <div class="list-panel rounded-3 p-3 p-md-4">
    @if (sales.length === 0) {
      <div class="text-center py-5">
        <p class="text-muted mb-3">No sales yet.</p>
        <a routerLink="/sales/create" class="btn btn-green btn-sm">Create first sale</a>
      </div>
    } @else {
      <div class="app-data-grid sales-grid" aria-label="Sales list">
        <ag-grid-angular
          [theme]="gridTheme"
          [rowData]="sales"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [pinnedBottomRowData]="grandTotalRow"
          [pagination]="true"
          [paginationPageSize]="10"
          [paginationPageSizeSelector]="false"
          [headerHeight]="41"
          [rowHeight]="41"
          [animateRows]="false"
          [suppressCellFocus]="true"
          [suppressRowHoverHighlight]="false"
        />
      </div>
    }
  </div>
</div>
