<div class="customer-edit">
  <div class="form-shell">
    <div class="form-toolbar">
      <div class="toolbar-title">
        <h1 class="page-title">Customer Edit</h1>
        <span class="toolbar-meta">Update record</span>
      </div>
      <a
        routerLink="/customers/list"
        class="icon-action icon-back"
        title="Back to list"
        aria-label="Back to customer list"
      >
        <span class="icon-graphic" aria-hidden="true"></span>
      </a>
    </div>

    @if (loadingCustomer) {
      <div class="state-block">
        <div class="spinner-border spinner-border-sm text-success" role="status" aria-hidden="true"></div>
        <span>Loading customer...</span>
      </div>
    } @else {
      <form class="edit-form" [formGroup]="customerForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="customerName" class="form-label">
              Name <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              id="customerName"
              type="text"
              class="form-control form-control-sm"
              formControlName="customerName"
              placeholder="Full name"
              [class.is-invalid]="submitted && f['customerName'].invalid"
            />
            @if (submitted && f['customerName'].errors?.['required']) {
              <div class="invalid-feedback">Customer name is required.</div>
            }
          </div>

          <div class="field">
            <label for="mobile" class="form-label">Mobile</label>
            <input
              id="mobile"
              type="text"
              class="form-control form-control-sm"
              formControlName="mobile"
              placeholder="Mobile number"
            />
          </div>

          <div class="field">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              type="email"
              class="form-control form-control-sm"
              formControlName="email"
              placeholder="email@example.com"
              [class.is-invalid]="submitted && f['email'].invalid"
            />
            @if (submitted && f['email'].errors?.['email']) {
              <div class="invalid-feedback">Enter a valid email.</div>
            }
          </div>

          <div class="field">
            <label for="address" class="form-label">Address</label>
            <input
              id="address"
              type="text"
              class="form-control form-control-sm"
              formControlName="address"
              placeholder="Address"
            />
          </div>

          <div class="field field-check">
            <div class="form-check">
              <input
                id="enabled"
                type="checkbox"
                class="form-check-input"
                formControlName="enabled"
              />
              <label for="enabled" class="form-check-label">Enabled</label>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-outline-green btn-sm" (click)="onClear()">
            Clear
          </button>
          <button type="submit" class="btn btn-green btn-sm" [disabled]="loading">
            {{ loading ? 'Updating...' : 'Update' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
