<div class="dashboard-home">
  <div class="page-header mb-4">
    <p class="page-eyebrow mb-1">Overview</p>
    <h1 class="page-title h4 mb-1">Dashboard</h1>
    <p class="text-muted small mb-0">Sample inventory overview and weekly activity.</p>
  </div>

  <div class="row g-3 mb-4">
    @for (card of summaryCards; track card.label) {
      <div class="col-6 col-lg-3">
        <div class="summary-card h-100 p-3 rounded-3">
          <div class="text-muted small">{{ card.label }}</div>
          <div class="fs-4 fw-semibold mt-1 page-title">{{ card.value }}</div>
          <div class="small text-success mt-1">{{ card.change }}</div>
        </div>
      </div>
    }
  </div>

  <div class="chart-panel rounded-3 p-3 p-md-4">
    <div class="chart-wrap">
      <canvas #inventoryChart aria-label="Weekly inventory activity chart"></canvas>
    </div>
  </div>
</div>
