<div class="financial-year-list">
  <div class="list-shell">
    <div class="list-toolbar">
      <div class="toolbar-title">
        <h1 class="page-title">Financial Years</h1>
        @if (hasLoaded) {
          <span class="toolbar-meta">{{ totalElements | bdNumber }} total</span>
        }
      </div>
      <a routerLink="/financial-years/create" class="btn-create" title="Create financial year">
        <span class="icon-plus" aria-hidden="true"></span>
        <span class="btn-create-label">Create</span>
      </a>
    </div>

    <form class="filter-bar" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <input type="text" class="form-control form-control-sm" formControlName="searchTerm" placeholder="Search" aria-label="Search term" />
      <input type="text" class="form-control form-control-sm" formControlName="fyCode" placeholder="FY code" aria-label="Financial year code" />
      <ng-select
        class="filter-ng-select"
        formControlName="isCurrent"
        placeholder="Select..."
        [clearable]="false"
        [searchable]="false"
        aria-label="Current year"
      >
        <ng-option [value]="true">Current: Yes</ng-option>
        <ng-option [value]="false">Current: No</ng-option>
      </ng-select>
      <button type="submit" class="btn btn-green btn-sm" [disabled]="loading">Search</button>
      <button type="button" class="btn btn-outline-green btn-sm" (click)="onReset()" [disabled]="loading">
        Reset
      </button>
    </form>

    <div class="table-wrap">
      @if (hasLoaded && totalElements === 0) {
        <div class="state-block">
          <span class="text-muted">No financial years found.</span>
          <a routerLink="/financial-years/create" class="btn btn-green btn-sm">Create first</a>
        </div>
      } @else {
        <div class="app-data-grid" aria-label="Financial year list">
          <ag-grid-angular
            [theme]="gridTheme"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [rowModelType]="'infinite'"
            [datasource]="dataSource"
            [pagination]="true"
            [paginationPageSize]="size"
            [paginationPageSizeSelector]="false"
            [paginationNumberFormatter]="paginationNumberFormatter"
            [cacheBlockSize]="size"
            [headerHeight]="41"
            [rowHeight]="41"
            [animateRows]="false"
            [suppressCellFocus]="true"
            [suppressRowHoverHighlight]="false"
            (gridReady)="onGridReady($event)"
            (cellClicked)="onCellClicked($event)"
          />
        </div>

      }
    </div>
  </div>

  <app-confirm-dialog
    [open]="!!pendingDelete"
    [danger]="true"
    title="Delete financial year"
    [message]="deleteDialogMessage"
    [detail]="deleteDialogDetail"
    confirmLabel="Delete"
    cancelLabel="Cancel"
    [busy]="!!deletingId"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
</div>
