<div class="stock-list">
  <div class="list-shell">
    <div class="list-toolbar">
      <div class="toolbar-title">
        <h1 class="page-title">Stock</h1>
        @if (hasLoaded) {
          <span class="toolbar-meta">{{ totalElements | bdNumber }} total</span>
        }
      </div>
    </div>

    <form class="filter-bar" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <input type="text" class="form-control form-control-sm" formControlName="searchTerm"
             placeholder="Search item or store" aria-label="Search term" />
      <ng-select
        class="filter-ng-select"
        formControlName="storeId"
        placeholder="All stores"
        [clearable]="true"
        [searchable]="true"
        [loading]="loadingStores"
        aria-label="Store">
        @for (store of storeOptions; track store.id) {
          <ng-option [value]="store.id">{{ storeLabel(store) }}</ng-option>
        }
      </ng-select>
      <ng-select
        class="filter-ng-select"
        formControlName="itemId"
        placeholder="Type to search item..."
        [clearable]="true"
        [searchable]="true"
        [typeahead]="itemTypeahead$"
        [minTermLength]="2"
        [loading]="loadingItems"
        notFoundText="Type at least 2 characters"
        aria-label="Item">
        @for (item of itemOptions; track item.id) {
          <ng-option [value]="item.id">{{ itemLabel(item) }}</ng-option>
        }
      </ng-select>
      <button type="submit" class="btn btn-green btn-sm" [disabled]="loading">Search</button>
      <button type="button" class="btn btn-outline-green btn-sm" (click)="onReset()" [disabled]="loading">
        Reset
      </button>
    </form>

    <div class="table-wrap">
      @if (hasLoaded && totalElements === 0) {
        <div class="state-block">
          <span class="text-muted">No stock records found.</span>
        </div>
      } @else {
        <div class="app-data-grid" aria-label="Stock list">
          <ag-grid-angular
            [theme]="gridTheme"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [rowModelType]="'infinite'"
            [datasource]="dataSource"
            [pagination]="true"
            [paginationPageSize]="size"
            [paginationPageSizeSelector]="false"
            [paginationNumberFormatter]="paginationNumberFormatter"
            [cacheBlockSize]="size"
            [headerHeight]="41"
            [rowHeight]="41"
            [animateRows]="false"
            [suppressCellFocus]="true"
            [suppressRowHoverHighlight]="false"
            (gridReady)="onGridReady($event)"
          />
        </div>

      }
    </div>
  </div>
</div>
