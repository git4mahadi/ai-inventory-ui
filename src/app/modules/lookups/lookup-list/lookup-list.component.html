<div class="lookup-list">
  <div class="list-shell">
    <div class="list-toolbar">
      <div class="toolbar-title">
        <h1 class="page-title">Lookups</h1>
        @if (hasLoaded) {
          <span class="toolbar-meta">{{ totalElements | bdNumber }} total</span>
        }
      </div>
      <a routerLink="/lookups/create" class="btn-create" title="Create lookup">
        <span class="icon-plus" aria-hidden="true"></span>
        <span class="btn-create-label">Create</span>
      </a>
    </div>

    <form class="filter-bar" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <input
        type="text"
        class="form-control form-control-sm"
        formControlName="searchTerm"
        placeholder="Search"
        aria-label="Search term"
      />
      <input
        type="text"
        class="form-control form-control-sm"
        formControlName="lookupName"
        placeholder="Name"
        aria-label="Lookup name"
      />
      <ng-select
        class="filter-ng-select"
        formControlName="lookupEnumKey"
        placeholder="All types"
        [clearable]="true"
        [searchable]="false"
        aria-label="Lookup type"
      >
        @for (type of lookupTypes; track type.key) {
          <ng-option [value]="type.key">{{ type.value }}</ng-option>
        }
      </ng-select>
      <button type="submit" class="btn btn-green btn-sm" [disabled]="loading">Search</button>
      <button type="button" class="btn btn-outline-green btn-sm" (click)="onReset()" [disabled]="loading">
        Reset
      </button>
    </form>

    <div class="table-wrap">
      @if (hasLoaded && totalElements === 0) {
        <div class="state-block">
          <span class="text-muted">No lookups found.</span>
          <a routerLink="/lookups/create" class="btn btn-green btn-sm">Create first</a>
        </div>
      } @else {
        <div class="app-data-grid" aria-label="Lookup list">
          <ag-grid-angular
            [theme]="gridTheme"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [rowModelType]="'infinite'"
            [datasource]="dataSource"
            [pagination]="true"
            [paginationPageSize]="size"
            [paginationPageSizeSelector]="false"
            [paginationNumberFormatter]="paginationNumberFormatter"
            [cacheBlockSize]="size"
            [headerHeight]="41"
            [rowHeight]="41"
            [animateRows]="false"
            [suppressCellFocus]="true"
            [suppressRowHoverHighlight]="false"
            (gridReady)="onGridReady($event)"
            (cellClicked)="onCellClicked($event)"
          />
        </div>

      }
    </div>
  </div>

  <app-confirm-dialog
    [open]="!!pendingDelete"
    [danger]="true"
    title="Delete lookup"
    [message]="deleteDialogMessage"
    [detail]="deleteDialogDetail"
    confirmLabel="Delete"
    cancelLabel="Cancel"
    [busy]="!!deletingId"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
</div>
